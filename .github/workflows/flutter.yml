name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-test-android:
    name: Analyze, test, and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: airbridge_mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform projects and resolve dependencies
        run: bash ./tool/bootstrap_platforms.sh

      - name: Analyze Dart sources
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.log
          analyze_exit=${PIPESTATUS[0]}
          if [[ $analyze_exit -ne 0 ]]; then
            while IFS= read -r diagnostic; do
              [[ -z "$diagnostic" ]] || echo "::error::$diagnostic"
            done < /tmp/flutter-analyze.log
          fi
          exit "$analyze_exit"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-test.log
          test_exit=${PIPESTATUS[0]}
          if [[ $test_exit -ne 0 ]]; then
            while IFS= read -r diagnostic; do
              [[ -z "$diagnostic" ]] || echo "::error::$diagnostic"
            done < /tmp/flutter-test.log
          fi
          exit "$test_exit"

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airbridge-android-release
          path: airbridge_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  build-desktop-and-ios:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: airbridge_mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev patchelf desktop-file-utils curl libfuse2 imagemagick

      - name: Bootstrap platform projects (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tool\bootstrap_platforms.ps1

      - name: Bootstrap platform projects (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./tool/bootstrap_platforms.sh

      - name: Build Linux desktop
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Smoke-test Linux AppImage packaging
        if: matrix.target == 'linux'
        run: ./tool/package_linux_appimage.sh "$RUNNER_TEMP/release-assets"

      - name: Build Windows desktop
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Install Inno Setup for installer packaging validation
        if: matrix.target == 'windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Smoke-test full Windows installer packaging
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $versionMatch = [regex]::Match($versionLine, '^version:\s*(\d+\.\d+\.\d+)')
          if (-not $versionMatch.Success) {
              throw 'Could not read X.Y.Z from pubspec.yaml version.'
          }
          $appVersion = $versionMatch.Groups[1].Value
          .\tool\package_windows_installer.ps1 -AppVersion $appVersion -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-assets')

      - name: Build macOS desktop
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Smoke-test macOS DMG packaging
        if: matrix.target == 'macos'
        run: ./tool/package_macos_dmg.sh "$RUNNER_TEMP/release-assets"

      - name: Build iOS (unsigned)
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign
