name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-test-android:
    name: Analyze, test, and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: airbridge_mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform projects and resolve dependencies
        run: bash ./tool/bootstrap_platforms.sh

      - name: Analyze Dart sources
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.log
          analyze_exit=${PIPESTATUS[0]}
          if [[ $analyze_exit -ne 0 ]]; then
            while IFS= read -r diagnostic; do
              [[ -z "$diagnostic" ]] || echo "::error::$diagnostic"
            done < /tmp/flutter-analyze.log
          fi
          exit "$analyze_exit"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-test.log
          test_exit=${PIPESTATUS[0]}
          if [[ $test_exit -ne 0 ]]; then
            while IFS= read -r diagnostic; do
              [[ -z "$diagnostic" ]] || echo "::error::$diagnostic"
            done < /tmp/flutter-test.log
          fi
          exit "$test_exit"

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airbridge-android-release
          path: airbridge_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  build-desktop-and-ios:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: airbridge_mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Bootstrap platform projects (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tool\bootstrap_platforms.ps1

      - name: Bootstrap platform projects (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./tool/bootstrap_platforms.sh

      - name: Build Linux desktop
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Build Windows desktop
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build macOS desktop
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Build iOS (unsigned)
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign
