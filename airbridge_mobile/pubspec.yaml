name: airbridge_mobile
description: Cross-platform Airbridge peer node for local mesh networking.
publish_to: none
version: 4.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.1
  file_picker: ^13.1.0
  butane_dart: ^0.2.0
  butane_bluez: ^0.2.0
  universal_ble: ^3.1.2
  crypto: 3.0.6
  cryptography: 2.7.0
  path_provider: 2.1.5
  mobile_scanner: ^6.0.2
  flutter_lite_camera: ^0.2.3
  qr_flutter: ^4.1.0
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/airbridge_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/airbridge_logo.png
  remove_alpha_ios: true
  adaptive_icon_background: '#FAFAFA'
  adaptive_icon_foreground: assets/airbridge_logo.png
  adaptive_icon_foreground_inset: 12
  macos:
    generate: true
    image_path: assets/airbridge_logo.png
  windows:
    generate: true
    image_path: assets/airbridge_logo.png
    icon_size: 256
