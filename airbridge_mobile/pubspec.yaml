name: airbridge_mobile
description: Cross-platform Airbridge peer node for local mesh networking.
publish_to: none
version: 4.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.6
  cryptography: 2.7.0
  path_provider: 2.1.5
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
